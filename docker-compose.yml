# ===========================================================================
# Peekaboo — self-hosted suite (runs entirely on your machine / home server)
#
#   docker compose up -d --build      # build + start everything
#   open http://localhost:8000
#
# Everything that stores data (Postgres, MinIO objects, ML models) lives under
# ${DATA_ROOT}. To put storage on an external hard disk / NAS mount, run:
#
#   DATA_ROOT=/mnt/peekaboo-data docker compose up -d
#
# See SELFHOST.md for external-drive, NAS and server options.
# ===========================================================================

name: peekaboo

services:
  # --- PostgreSQL 16 + pgvector (the face-embedding database) ---------------
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peekaboo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peekaboo}
      POSTGRES_DB: ${POSTGRES_DB:-peekaboo}
    volumes:
      - ${DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peekaboo} -d ${POSTGRES_DB:-peekaboo}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- MinIO — S3-compatible object storage (photos, crops, selfies) --------
  # Storage is S3 by design so the "disk" is swappable: point this at an
  # external drive, a NAS, or any S3 service (Neon / R2) — zero code changes.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"    # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # web console
    volumes:
      - ${DATA_ROOT:-./data}/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- one-shot: create the bucket MinIO serves to the app ------------------
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      BUCKET_NAME: ${BUCKET_NAME:-pekaboo}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$BUCKET_NAME &&
      echo 'bucket ready: '$$BUCKET_NAME
      "

  # --- the app --------------------------------------------------------------
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-peekaboo}:${POSTGRES_PASSWORD:-peekaboo}@db:5432/${POSTGRES_DB:-peekaboo}
      STORAGE_BACKEND: s3
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      S3_BUCKET: ${BUCKET_NAME:-pekaboo}
      # Persist the downloaded InsightFace pack (~370 MB) across restarts.
      MODEL_DIR: /app/models
      # Runtime tuning — on a small home server use buffalo_s + 512.
      FACE_MODEL: ${FACE_MODEL:-buffalo_l}
      DET_SIZE: ${DET_SIZE:-640}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      MAX_IMAGE_SIDE: ${MAX_IMAGE_SIDE:-2048}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      COOKIE_SECURE: "false"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - peekaboo-models:/app/models

volumes:
  peekaboo-models:
    name: peekaboo-models
